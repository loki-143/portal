<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Parser Benchmark - PyMuPDF + PaddleOCR</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .upload-section {
            background: white;
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .upload-area {
            border: 3px dashed #667eea;
            border-radius: 8px;
            padding: 40px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            background: #f8f9ff;
        }

        .upload-area:hover {
            border-color: #764ba2;
            background: #f0f2ff;
        }

        .upload-area.dragover {
            border-color: #764ba2;
            background: #e8ebff;
            transform: scale(1.02);
        }

        .upload-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .upload-text {
            font-size: 1.2rem;
            color: #333;
            margin-bottom: 10px;
        }

        .upload-hint {
            color: #666;
            font-size: 0.9rem;
        }

        #fileInput {
            display: none;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .result-card {
            background: white;
            border-radius: 12px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            animation: slideIn 0.3s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .result-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #333;
            word-break: break-all;
        }

        .result-close {
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .result-close:hover {
            background: #ff3838;
            transform: scale(1.1);
        }

        .metrics {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .metric {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .metric-label {
            font-size: 0.85rem;
            color: #666;
            margin-bottom: 5px;
        }

        .metric-value {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
        }

        .metric.success {
            border-left-color: #2ecc71;
        }

        .metric.warning {
            border-left-color: #f39c12;
        }

        .metric.error {
            border-left-color: #e74c3c;
        }

        .extractor-badge {
            display: inline-block;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-top: 5px;
        }

        .extractor-badge.pymupdf {
            background: #2ecc71;
            color: white;
        }

        .extractor-badge.paddleocr {
            background: #3498db;
            color: white;
        }

        .extractor-badge.custom {
            background: #f39c12;
            color: white;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 1rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .section-content {
            background: #f8f9ff;
            padding: 15px;
            border-radius: 8px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            line-height: 1.6;
            white-space: pre-wrap;
            word-break: break-word;
        }

        .metadata-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px;
        }

        .metadata-item {
            background: #f8f9ff;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
        }

        .metadata-key {
            color: #666;
            margin-bottom: 3px;
        }

        .metadata-value {
            color: #333;
            font-weight: 600;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #667eea;
        }

        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .error-message {
            background: #ffe6e6;
            color: #c0392b;
            padding: 15px;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
            margin-bottom: 20px;
        }

        .comparison-section {
            background: white;
            border-radius: 12px;
            padding: 25px;
            margin-top: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .comparison-title {
            font-size: 1.5rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 20px;
        }

        .comparison-table {
            width: 100%;
            border-collapse: collapse;
        }

        .comparison-table th,
        .comparison-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #f0f0f0;
        }

        .comparison-table th {
            background: #f8f9ff;
            font-weight: 600;
            color: #333;
        }

        .comparison-table tr:hover {
            background: #f8f9ff;
        }

        .toggle-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.2s;
            margin-top: 10px;
        }

        .toggle-btn:hover {
            background: #764ba2;
        }

        .collapsed {
            max-height: 100px;
        }

        .expand-icon {
            transition: transform 0.3s;
        }

        .expand-icon.expanded {
            transform: rotate(180deg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📄 Resume Parser Benchmark</h1>
            <p>PyMuPDF + PaddleOCR | Test your PDFs and see extraction results in real-time</p>
        </div>

        <div class="upload-section">
            <div class="upload-area" id="uploadArea">
                <div class="upload-icon">📤</div>
                <div class="upload-text">Drop PDF files here or click to browse</div>
                <div class="upload-hint">Supports multiple files • Max 10MB per file</div>
            </div>
            <input type="file" id="fileInput" accept=".pdf" multiple>
        </div>

        <div id="loadingIndicator" class="loading" style="display: none;">
            <div class="spinner"></div>
            <div>Processing PDF...</div>
        </div>

        <div id="errorContainer"></div>

        <div id="resultsContainer" class="results-grid"></div>

        <div id="comparisonSection" class="comparison-section" style="display: none;">
            <div class="comparison-title">📊 Comparison Summary</div>
            <table class="comparison-table">
                <thead>
                    <tr>
                        <th>File Name</th>
                        <th>Extractor</th>
                        <th>Time (s)</th>
                        <th>Characters</th>
                        <th>Lines</th>
                        <th>Columns</th>
                    </tr>
                </thead>
                <tbody id="comparisonTableBody"></tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        let results = [];

        const uploadArea = document.getElementById('uploadArea');
        const fileInput = document.getElementById('fileInput');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const errorContainer = document.getElementById('errorContainer');
        const resultsContainer = document.getElementById('resultsContainer');
        const comparisonSection = document.getElementById('comparisonSection');
        const comparisonTableBody = document.getElementById('comparisonTableBody');

        // Upload area click
        uploadArea.addEventListener('click', () => fileInput.click());

        // File input change
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // Drag and drop
        uploadArea.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadArea.classList.add('dragover');
        });

        uploadArea.addEventListener('dragleave', () => {
            uploadArea.classList.remove('dragover');
        });

        uploadArea.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadArea.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        async function handleFiles(files) {
            const pdfFiles = Array.from(files).filter(f => f.type === 'application/pdf');
            
            if (pdfFiles.length === 0) {
                showError('Please select PDF files only');
                return;
            }

            for (const file of pdfFiles) {
                if (file.size > 10 * 1024 * 1024) {
                    showError(`File ${file.name} is too large (max 10MB)`);
                    continue;
                }
                await processFile(file);
            }
        }

        async function processFile(file) {
            loadingIndicator.style.display = 'block';
            errorContainer.innerHTML = '';

            const startTime = performance.now();

            try {
                const formData = new FormData();
                formData.append('file', file);
                formData.append('resume_id', `test_${Date.now()}`);
                formData.append('candidate_type', 'lateral');

                const response = await fetch(`${API_URL}/v1/parse`, {
                    method: 'POST',
                    body: formData
                });

                const endTime = performance.now();
                const processingTime = ((endTime - startTime) / 1000).toFixed(2);

                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                }

                const data = await response.json();
                
                const result = {
                    fileName: file.name,
                    fileSize: file.size,
                    processingTime: processingTime,
                    text: data.resume_text || '',
                    lines: data.resume_text ? data.resume_text.split('\n').filter(l => l.trim()) : [],
                    detected_columns: data.parser_metadata?.detected_columns || 1,
                    metadata: {
                        extractor_name: data.parser_metadata?.extractor_name || 'unknown',
                        page_count: data.parser_metadata?.page_count || 0,
                        ...data.parser_metadata
                    }
                };

                results.push(result);
                displayResult(result);
                updateComparison();

            } catch (error) {
                showError(`Failed to process ${file.name}: ${error.message}`);
            } finally {
                loadingIndicator.style.display = 'none';
            }
        }

        function displayResult(result) {
            const card = document.createElement('div');
            card.className = 'result-card';
            
            const extractorClass = result.metadata?.extractor_name || 'custom';
            const extractorLabel = extractorClass === 'pymupdf' ? 'PyMuPDF' : 
                                   extractorClass === 'paddleocr' ? 'PaddleOCR' : 
                                   'Custom Parser';

            card.innerHTML = `
                <div class="result-header">
                    <div class="result-title">${result.fileName}</div>
                    <button class="result-close" onclick="removeResult(this)">×</button>
                </div>

                <div class="metrics">
                    <div class="metric success">
                        <div class="metric-label">Processing Time</div>
                        <div class="metric-value">${result.processingTime}s</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Extractor</div>
                        <div class="metric-value">
                            <span class="extractor-badge ${extractorClass}">${extractorLabel}</span>
                        </div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Characters</div>
                        <div class="metric-value">${result.text?.length || 0}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Lines</div>
                        <div class="metric-value">${result.lines?.length || 0}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">File Size</div>
                        <div class="metric-value">${formatFileSize(result.fileSize)}</div>
                    </div>
                    <div class="metric">
                        <div class="metric-label">Columns Detected</div>
                        <div class="metric-value">${result.detected_columns || 1}</div>
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">
                        📋 Metadata
                    </div>
                    <div class="metadata-grid">
                        ${Object.entries(result.metadata || {}).map(([key, value]) => `
                            <div class="metadata-item">
                                <div class="metadata-key">${key}</div>
                                <div class="metadata-value">${JSON.stringify(value)}</div>
                            </div>
                        `).join('')}
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">
                        📝 Extracted Text
                        <button class="toggle-btn" onclick="toggleSection(this)">
                            <span class="expand-icon">▼</span> Expand
                        </button>
                    </div>
                    <div class="section-content collapsed" id="text-${results.length - 1}">
${result.text || 'No text extracted'}
                    </div>
                </div>

                <div class="section">
                    <div class="section-title">
                        📄 Lines (${result.lines?.length || 0})
                        <button class="toggle-btn" onclick="toggleSection(this)">
                            <span class="expand-icon">▼</span> Expand
                        </button>
                    </div>
                    <div class="section-content collapsed" id="lines-${results.length - 1}">
${result.lines?.join('\n') || 'No lines extracted'}
                    </div>
                </div>
            `;

            resultsContainer.appendChild(card);
        }

        function toggleSection(btn) {
            const content = btn.parentElement.nextElementSibling;
            const icon = btn.querySelector('.expand-icon');
            
            if (content.classList.contains('collapsed')) {
                content.classList.remove('collapsed');
                icon.classList.add('expanded');
                btn.innerHTML = '<span class="expand-icon expanded">▼</span> Collapse';
            } else {
                content.classList.add('collapsed');
                icon.classList.remove('expanded');
                btn.innerHTML = '<span class="expand-icon">▼</span> Expand';
            }
        }

        function removeResult(btn) {
            const card = btn.closest('.result-card');
            const index = Array.from(resultsContainer.children).indexOf(card);
            results.splice(index, 1);
            card.remove();
            updateComparison();
        }

        function updateComparison() {
            if (results.length === 0) {
                comparisonSection.style.display = 'none';
                return;
            }

            comparisonSection.style.display = 'block';
            comparisonTableBody.innerHTML = results.map(r => `
                <tr>
                    <td>${r.fileName}</td>
                    <td><span class="extractor-badge ${r.metadata?.extractor_name || 'custom'}">${r.metadata?.extractor_name || 'custom'}</span></td>
                    <td>${r.processingTime}s</td>
                    <td>${r.text?.length || 0}</td>
                    <td>${r.lines?.length || 0}</td>
                    <td>${r.detected_columns || 1}</td>
                </tr>
            `).join('');
        }

        function showError(message) {
            errorContainer.innerHTML = `
                <div class="error-message">
                    ⚠️ ${message}
                </div>
            `;
            setTimeout(() => {
                errorContainer.innerHTML = '';
            }, 5000);
        }

        function formatFileSize(bytes) {
            if (bytes < 1024) return bytes + ' B';
            if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
            return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
        }
    </script>
</body>
</html>
